openapi: 3.0.3
info:
  title: Student PDF Report Service + School Management Upstream API
  description: |
    This specification describes two surfaces:

    * **upstream** — the subset of the existing Node.js School Management backend
      that this microservice *consumes* (`/api/v1/auth/login` and
      `/api/v1/students/{id}`). Used to generate the outbound HTTP client.
    * **report** — the API this microservice *serves*
      (`/api/v1/students/{id}/report`). Used to generate the inbound HTTP server
      and a typed client for integration tests.

    Operations are separated with the `upstream` and `report` tags so that code
    generation can target each surface independently.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Report microservice (this service)
  - url: http://localhost:5007
    description: Node.js School Management backend (upstream)

tags:
  - name: upstream
    description: Endpoints on the Node.js backend that this service consumes.
  - name: report
    description: Endpoints served by this microservice.

paths:
  /api/v1/auth/login:
    post:
      tags: [upstream]
      operationId: login
      summary: Authenticate and receive session cookies (accessToken, refreshToken, csrfToken).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded. Session cookies are returned via Set-Cookie.
          headers:
            Set-Cookie:
              description: accessToken, refreshToken and csrfToken cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBasic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/students/{id}:
    get:
      tags: [upstream]
      operationId: getStudentDetail
      summary: Fetch the full detail of a single student.
      description: |
        Requires an authenticated session obtained from `login`: the `accessToken`
        session cookie together with the matching `X-CSRF-Token` header.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/students/{id}/report:
    get:
      tags: [report]
      operationId: getStudentReport
      summary: Generate and download a PDF report for a student.
      description: |
        Fetches the student's data from the upstream Node.js backend and renders
        a downloadable PDF report. The service never touches the database directly.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: The generated PDF report.
          headers:
            Content-Disposition:
              description: Attachment file name for the report.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    # The upstream Node.js backend authenticates via a session cookie plus a
    # double-submit CSRF token. Both are issued by the `login` operation.
    sessionCookie:
      type: apiKey
      in: cookie
      name: accessToken
      description: Session access token issued by login (via Set-Cookie).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token; must match the csrfToken cookie value.

  parameters:
    StudentId:
      name: id
      in: path
      required: true
      description: Numeric identifier of the student (users.id).
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication failed or session is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is not allowed to access the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested student does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: The upstream backend could not be reached or returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: An unexpected error occurred while processing the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: Error envelope. Matches the Node.js backend error shape.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          description: The user's email address.
        password:
          type: string
          minLength: 6

    AccountBasic:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        role:
          type: string

    StudentDetail:
      type: object
      description: Full student profile as returned by the Node.js backend.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        systemAccess:
          type: boolean
          nullable: true
        phone:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        dob:
          type: string
          nullable: true
        class:
          type: string
          nullable: true
        section:
          type: string
          nullable: true
        roll:
          type: integer
          format: int64
          nullable: true
        fatherName:
          type: string
          nullable: true
        fatherPhone:
          type: string
          nullable: true
        motherName:
          type: string
          nullable: true
        motherPhone:
          type: string
          nullable: true
        guardianName:
          type: string
          nullable: true
        guardianPhone:
          type: string
          nullable: true
        relationOfGuardian:
          type: string
          nullable: true
        currentAddress:
          type: string
          nullable: true
        permanentAddress:
          type: string
          nullable: true
        admissionDate:
          type: string
          nullable: true
        reporterName:
          type: string
          nullable: true
