# Report microservice configuration.
#
# Adapters bind each hexagonal port to a named implementation. The settings for
# the selected implementation live under adapters.<port>.<type>, so you can
# switch adapters by changing `type` without touching code.

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 30s
  shutdown_timeout: 10s

telemetry:
  # exporter: stdout | otlp | none
  exporter: stdout
  otlp_endpoint: localhost:4317
  sample_ratio: 1.0

adapters:
  student_repository:
    type: http
    http:
      base_url: http://localhost:5007
      username: admin@school-admin.com
      password: 3OU4zn3q6Zh9
      session_ttl: 10m
      retry:
        max_retries: 3
        wait_min: 200ms
        wait_max: 2s

  report_generator:
    type: pdf
    pdf:
      title: Student Report
      organization: Greenwood High School
